{% extends 'modelo.html' %}
{% block conteudo %}
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="w-100" style="max-width: 700px;">
      <div class="card shadow-sm p-4">
        <h1 class="text-center mb-3">Cadastro Funcionário</h1>
        <h2 class="text-center mb-4">Cadastre os dados do funcionário</h2>
        <hr />

        <form action="" method="post">
          {% csrf_token %}

          {{ form.as_p }}

          <div class="text-center mt-3 d-flex justify-content-center gap-2 flex-wrap">
            <button class="btn btn-primary" type="submit">Cadastrar</button>
            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">Voltar para página anterior</button>
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Voltar para tela inicial</a>
          </div>
        </form>
      </div>
    </div>
  </div>

    
{% endblock %}
