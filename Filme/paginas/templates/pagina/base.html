{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block title%}
    <title>DrakeMovies</title>
    {% endblock%}
</head>

<body>
    {% block header%}
    <nav class="navbar navbar-expand-lg bg-body shadow-sm sticky-top py-3">
        <div class="container">

            <!-- Identidade Visual (Logo) -->
           <a class="brand-footer" href="{% url 'inicio' %}">
                        <span class="brand-mark">D</span>
                        <span>DrakeMovies</span>
                    </a>

            <!-- Botão Hambúrguer: Aparece APENAS em telas menores (Mobile/Tablet) -->
            <button class="navbar-toggler custom-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuResponsivo" aria-controls="menuResponsivo" aria-expanded="false"
                aria-label="Expandir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Conteúdo do Menu: Horizontal no desktop, sanfona/hambúrguer no mobile -->
            <div class="collapse navbar-collapse" id="menuResponsivo">
                <!-- ms-auto empurra os links para a direita no computador -->
                <ul class="navbar-nav ms-auto align-items-lg-center gap-3 gap-lg-4 pt-3 pt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-medium" href="{% url 'inicio' %}">
                            <span class="nav-icon"><i class="bi bi-film"></i></span>
                            Filmes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-medium" href="{% url 'series' %}">
                            <span class="nav-icon"><i class="bi bi-play-circle"></i></span>
                            Séries
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-medium" href="#">
                            <span class="nav-icon"><i class="bi bi-bell"></i></span>
                            Novidades
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary fw-medium" href="#">
                            <span class="nav-icon"><i class="bi bi-info-circle"></i></span>
                            Sobre
                        </a>
                    </li>
                    <!-- Botão de Ação -->
                    <li class="nav-item mt-2 mt-lg-0 ms-lg-2">
                        <a class="btn btn-primary btn-sm px-3 rounded-pill fw-semibold w-100 w-lg-auto" href="{% url 'login' %}">
                            <i class="bi bi-play-fill me-1"></i>Login
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>



    {% endblock %}

    {% block content%}
    {% endblock %}

    {% block footer%}
    <footer class="site-footer">
        <div class="container">
            <div class="row align-items-center justify-content-between g-4">
                <div class="col-12 col-md-auto text-center text-md-start">
                    <a class="brand-footer" href="#">
                        <span class="brand-mark">D</span>
                        <span>DrakeMovies</span>
                    </a>
                    <p class="small mb-0 text-white-50">&copy; 2026 DrakeMovies. Todos os direitos reservados.</p>
                </div>

                <div class="col-12 col-md-auto text-center text-md-end">
                    <div class="social-icons">
                        <a href="#" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
                        <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                        <a href="#" aria-label="X"><i class="bi bi-twitter-x"></i></a>
                        <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    {% endblock %}


</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>

</html>
